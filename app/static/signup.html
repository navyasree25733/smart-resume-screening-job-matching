.signup-container{

    width:100%;

    max-width:520px;

    background:rgba(255,255,255,0.06);

    border:1px solid rgba(255,255,255,0.08);

    backdrop-filter:blur(18px);

    padding:45px;

    position:relative;

    z-index:5;

    box-shadow:

    margin:40px 0;
}
/* LOGO */

.signup-logo{

    width:90px;
    height:90px;

    border-radius:30px;

    margin:auto auto 30px;

    background:
    linear-gradient(
        135deg,
        #43e97b,
        #38f9d7
    );

    display:flex;
    justify-content:center;
    align-items:center;

    box-shadow:
    0 12px 30px rgba(67,233,123,0.25);
}

.signup-logo i{

    font-size:38px;

    color:#021b26;
}

/* TITLE */

.signup-title{

    text-align:center;

    margin-bottom:35px;
}

.signup-title h1{

    color:white;

    font-size:40px;

    margin-bottom:12px;
}

.signup-title p{

    color:#b8c8cf;

    line-height:1.7;
}

/* FORM GRID */

.form-grid{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:18px;
}

/* INPUT GROUP */

.input-group{

    margin-bottom:22px;
}

.input-group label{

    display:block;

    margin-bottom:10px;

    color:#dbe7ec;

    font-size:15px;

    font-weight:600;
}

.input-box{

    position:relative;
}

.input-box i{

    position:absolute;

    top:50%;
    left:18px;

    transform:translateY(-50%);

    color:#59f08b;

    font-size:16px;
}

.input-box input,
.input-box select{

    width:100%;

    padding:18px 18px 18px 52px;

    border:none;

    outline:none;

    border-radius:18px;

    background:rgba(255,255,255,0.06);

    border:1px solid rgba(255,255,255,0.08);

    color:white;

    font-size:15px;

    transition:0.3s;
}

.input-box input::placeholder{

    color:#9fb3bd;
}

.input-box input:focus,
.input-box select:focus{

    border-color:rgba(67,233,123,0.35);

    box-shadow:
    0 0 0 4px rgba(67,233,123,0.08);
}

/* SELECT */

.input-box select{

    appearance:none;

    color:#dbe7ec;
}

.input-box option{

    background:#062432;

    color:white;
}

/* FULL WIDTH */

.full-width{

    grid-column:1/3;
}

/* TERMS */

.terms{

    display:flex;

    align-items:flex-start;

    gap:12px;

    margin:10px 0 28px;

    color:#b8c8cf;

    font-size:14px;

    line-height:1.7;
}

.terms a{

    color:#59f08b;

    text-decoration:none;
}

/* BUTTON */

.signup-btn{

    width:100%;

    padding:18px;

    border:none;

    border-radius:18px;

    background:
    linear-gradient(
        135deg,
        #43e97b,
        #38f9d7
    );

    color:#021b26;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    transition:0.35s;

    margin-bottom:25px;
}

.signup-btn:hover{

    transform:translateY(-3px);

    box-shadow:

}

/* LOGIN */

.login-text{

    font-size:15px;

<script>
document.getElementById("signupForm")
.addEventListener("submit", async function(e) {

    e.preventDefault();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
        alert("Passwords do not match");
        return;
    }

    const fullName =
        document.getElementById("firstName").value +
        " " +
        document.getElementById("lastName").value;

    const email =
        document.getElementById("email").value;

    const username =
        email.split("@")[0];

    const role =
        document.getElementById("role").value;

    const response = await fetch("/api/signup", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            full_name: fullName,
            email: email,
            username: username,
            password: password,
            is_employer: role === "HR"
        })
    });

    const data = await response.json();

    if (response.ok) {
        alert("Account created successfully");
        window.location.href = "/login";
    }
    else {
        alert(data.detail);
    }
});
</script>
</body>
</html>
