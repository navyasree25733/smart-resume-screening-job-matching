<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        TalentSync Login
    </title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >
<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#021b26;
    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

    position:relative;
}

/* BACKGROUND GLOW */

body::before{

    content:"";

    position:absolute;

    width:450px;
    height:450px;

    border-radius:50%;

    background:
    radial-gradient(
        rgba(67,233,123,0.18),
        transparent 70%
    );

    top:-120px;
    left:-120px;

    animation:floatGlow 8s ease-in-out infinite;
}

body::after{

    content:"";

    position:absolute;

    width:400px;
    height:400px;

    border-radius:50%;

    background:
    radial-gradient(
        rgba(56,249,215,0.12),
        transparent 70%
    );

    bottom:-120px;
    right:-120px;

    animation:floatGlowReverse 10s ease-in-out infinite;
}

/* LOGIN CONTAINER */

.login-container{

    width:100%;
    max-width:430px;

    background:rgba(255,255,255,0.06);

    border:1px solid rgba(255,255,255,0.08);

    backdrop-filter:blur(18px);

    border-radius:34px;

    padding:45px;

    position:relative;

    z-index:5;

    overflow:hidden;

    cursor:pointer;

    transition:
    transform 0.45s ease,
    box-shadow 0.45s ease,
    border-color 0.45s ease,
    background 0.45s ease;

    box-shadow:
    0 20px 50px rgba(0,0,0,0.3);
}

/* CONTAINER GLOW */

.login-container::before{

    content:"";

    position:absolute;

    width:220px;
    height:220px;

    background:
    radial-gradient(
        rgba(67,233,123,0.18),
        transparent 70%
    );

    top:-100px;
    right:-100px;

    transition:0.5s ease;
}

.login-container::after{

    content:"";

    position:absolute;

    width:180px;
    height:180px;

    background:
    radial-gradient(
        rgba(56,249,215,0.12),
        transparent 70%
    );

    bottom:-80px;
    left:-80px;

    transition:0.5s ease;
}

/* HOVER EFFECT */

.login-container:hover{

    transform:
    translateY(-10px)
    scale(1.02);

    border-color:
    rgba(67,233,123,0.35);

    background:
    rgba(255,255,255,0.08);

    box-shadow:
    0 30px 70px rgba(67,233,123,0.18);
}

/* GLOW HOVER */

.login-container:hover::before{

    transform:scale(1.2);
}

.login-container:hover::after{

    transform:scale(1.15);
}

/* LOGO */

.login-logo{

    width:85px;
    height:85px;

    border-radius:28px;

    margin:auto auto 28px;

    background:
    linear-gradient(
        135deg,
        #43e97b,
        #38f9d7
    );

    display:flex;
    justify-content:center;
    align-items:center;

    box-shadow:
    0 12px 30px rgba(67,233,123,0.25);

    transition:0.4s ease;
}

.login-container:hover .login-logo{

    transform:rotate(-6deg) scale(1.05);
}

.login-logo i{

    font-size:36px;
    color:#021b26;
}

/* TITLE */

.login-title{

    text-align:center;

    margin-bottom:35px;
}

.login-title h1{

    color:white;

    font-size:40px;

    margin-bottom:12px;
}

.login-title p{

    color:#b8c8cf;

    line-height:1.7;
}

/* INPUT GROUP */

.input-group{

    margin-bottom:24px;
}

.input-group label{

    display:block;

    margin-bottom:10px;

    color:#dbe7ec;

    font-size:15px;

    font-weight:600;
}

.input-box{

    position:relative;
}

.input-box i{

    position:absolute;

    top:50%;
    left:18px;

    transform:translateY(-50%);

    color:#59f08b;

    font-size:16px;
}

.input-box input{

    width:100%;

    padding:18px 18px 18px 52px;

    border:none;

    outline:none;

    border-radius:18px;

    background:rgba(255,255,255,0.06);

    border:1px solid rgba(255,255,255,0.08);

    color:white;

    font-size:15px;

    transition:0.35s ease;
}

.input-box input::placeholder{

    color:#9fb3bd;
}

.input-box input:focus{

    border-color:rgba(67,233,123,0.35);

    transform:scale(1.01);

    box-shadow:
    0 0 0 4px rgba(67,233,123,0.08),
    0 10px 25px rgba(67,233,123,0.08);
}

/* OPTIONS */

.login-options{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:28px;
}

.remember-me{

    display:flex;

    align-items:center;

    gap:10px;

    color:#b8c8cf;

    font-size:14px;
}

.forgot-link{

    color:#59f08b;

    text-decoration:none;

    font-size:14px;

    transition:0.3s;
}

.forgot-link:hover{

    opacity:0.8;
}

/* BUTTON */

.login-btn{

    width:100%;

    padding:18px;

    border:none;

    border-radius:18px;

    background:
    linear-gradient(
        135deg,
        #43e97b,
        #38f9d7
    );

    color:#021b26;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    transition:0.35s;

    margin-bottom:24px;
}

.login-btn:hover{

    transform:
    translateY(-4px)
    scale(1.01);

    box-shadow:
    0 15px 35px rgba(67,233,123,0.22);
}

/* SIGNUP */

.signup-text{

    text-align:center;

    color:#b8c8cf;

    font-size:15px;
}

.signup-text a{

    color:#59f08b;

    text-decoration:none;

    font-weight:bold;
}

/* ANIMATIONS */

@keyframes floatGlow{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(20px);
    }

    100%{
        transform:translateY(0px);
    }
}

@keyframes floatGlowReverse{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-20px);
    }

    100%{
        transform:translateY(0px);
    }
}

/* RESPONSIVE */

@media(max-width:500px){

    .login-container{

        margin:20px;

        padding:35px 25px;
    }

    .login-title h1{

        font-size:32px;
    }
}


    /* SPARKLES */

.sparkles{

    position:absolute;

    width:100%;

    height:100%;

    top:0;
    left:0;

    overflow:hidden;

    z-index:1;

    pointer-events:none;
}

/* PARTICLES */

.sparkles span{

    position:absolute;

    display:block;

    width:4px;
    height:4px;

    border-radius:50%;

    background:rgb(35, 146, 40);

    box-shadow:
    0 0 10px rgba(255,255,255,0.9),
    0 0 20px rgba(67,233,123,0.6),
    0 0 30px rgba(56,249,215,0.5);

    animation:sparkle 6s linear infinite;
}

/* RANDOM POSITIONS */

.sparkles span:nth-child(1){

    top:10%;
    left:15%;

    animation-duration:4s;
}

.sparkles span:nth-child(2){

    top:20%;
    left:75%;

    animation-duration:6s;
}

.sparkles span:nth-child(3){

    top:70%;
    left:20%;

    animation-duration:5s;
}

.sparkles span:nth-child(4){

    top:50%;
    left:85%;

    animation-duration:7s;
}

.sparkles span:nth-child(5){

    top:80%;
    left:60%;

    animation-duration:4.5s;
}

.sparkles span:nth-child(6){

    top:35%;
    left:45%;

    animation-duration:6.5s;
}

.sparkles span:nth-child(7){

    top:15%;
    left:55%;

    animation-duration:5.5s;
}

.sparkles span:nth-child(8){

    top:60%;
    left:10%;

    animation-duration:7s;
}

.sparkles span:nth-child(9){

    top:85%;
    left:90%;

    animation-duration:5s;
}

.sparkles span:nth-child(10){

    top:40%;
    left:30%;

    animation-duration:6s;
}

/* ANIMATION */

@keyframes sparkle{

    0%{

        transform:scale(0.5);

        opacity:0.2;
    }

    50%{

        transform:scale(1.8);

        opacity:1;
    }

    100%{

        transform:scale(0.5);

        opacity:0.2;
    }
}
/* BACK BUTTON */

.back-home-btn{

    position:absolute;

    top:30px;

    left:30px;

    display:flex;

    align-items:center;

    gap:12px;

    padding:14px 22px;

    border:none;

    border-radius:18px;

    background:rgba(255,255,255,0.06);

    border:1px solid rgba(255,255,255,0.08);

    backdrop-filter:blur(16px);

    color:white;

    font-size:15px;

    font-weight:600;

    cursor:pointer;

    transition:0.35s ease;

    z-index:20;

    box-shadow:
    0 10px 25px rgba(0,0,0,0.18);
}

/* ICON */

.back-home-btn i{

    color:#43e97b;

    font-size:14px;
}

/* HOVER */

.back-home-btn:hover{

    transform:
    translateY(-4px)
    scale(1.02);

    border-color:
    rgba(67,233,123,0.3);

    background:
    rgba(255,255,255,0.08);

    box-shadow:
    0 15px 35px rgba(67,233,123,0.15);
}

/* MOBILE */

@media(max-width:600px){

    .back-home-btn{

        top:20px;

        left:20px;

        padding:12px 18px;

        font-size:14px;
    }
}
</style>
</head>

<body>
    <!-- SPARKLES -->

<div class="sparkles">

    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>

</div>
<!-- BACK TO HOME -->

<button
    class="back-home-btn"
    onclick="window.location.href='/'"
>

    <i class="fa-solid fa-arrow-left"></i>

    Back to Home

</button>
    <div class="login-container">


        <div class="login-title">

            <h1>
                Welcome Back
            </h1>

            <p>
                Login to access your AI recruitment dashboard
                and resume intelligence platform.
            </p>

        </div>

        <!-- FORM -->

        <!-- <form method="POST" action="/login"> -->
        <form id="loginForm">

            <div class="input-group">

                <label>
                    Email Address
                </label>

                <div class="input-box">

                    <i class="fa-solid fa-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>

            </div>

            <div class="input-group">

                <label>
                    Password
                </label>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>

            </div>

            <div class="login-options">

                <div class="remember-me">

                    <input type="checkbox">

                    Remember Me

                </div>

                <a href="#" class="forgot-link">
                    Forgot Password?
                </a>

            </div>

            <button
                type="submit"
                class="login-btn"
            >

                Login to Dashboard

            </button>

        </form>

        <!-- SIGNUP -->

        <div class="signup-text">

            Don't have an account?

            <a href="/signup">
                Create Account
            </a>

        </div>

    </div>
<script>
document.getElementById("loginForm")
.addEventListener("submit", async function(e) {

    e.preventDefault();

    const response = await fetch("/api/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value
        })
    });

    const data = await response.json();

    if (response.ok) {

        localStorage.setItem(
            "currentUser",
            JSON.stringify(data)
        );

        // Redirect based on role
        // if (data.is_employer) {
        //     window.location.href = "/static/hr/H-D.html";
        // } else {
        //     window.location.href = "/static/consumer/C-D.html";
        // }
        window.location.href =
        data.dashboard;

    } else {
        alert(data.detail);
    }
});
</script>
</body>
</html>
