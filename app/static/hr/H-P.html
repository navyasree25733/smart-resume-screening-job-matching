<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:
    linear-gradient(
        135deg,
        #021b26,
        #062432,
        #0b3142
    );
    color:white;
    min-height:100vh;
    overflow-x:hidden;
}

/* BACKGROUND EFFECTS */

body::before{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    border-radius:50%;
    background:
    radial-gradient(
        rgba(67,233,123,0.12),
        transparent 70%
    );
    top:-180px;
    left:-150px;
    z-index:-1;
}

body::after{
    content:"";
    position:fixed;
    width:450px;
    height:450px;
    border-radius:50%;
    background:
    radial-gradient(
        rgba(139,92,246,0.14),
        transparent 70%
    );
    bottom:-180px;
    right:-150px;
    z-index:-1;
}

/* MAIN LAYOUT */

.main-layout{
    display:flex;
    min-height:100vh;
}

/* SIDEBAR */

.sidebar{
    width:280px;
    background:
    linear-gradient(
        180deg,
        rgba(7,25,38,0.96),
        rgba(5,18,28,0.98)
    );
    border-right:
    1px solid rgba(255,255,255,0.08);
    padding:25px 18px;
    position:sticky;
    top:0;
    height:100vh;
    backdrop-filter:blur(20px);
}

.logo-section{
    display:flex;
    align-items:center;
    gap:18px;
    margin-bottom:40px;
}

.menu-btn{
    width:46px;
    height:46px;
    border:none;
    border-radius:16px;
    cursor:pointer;
    color:#021b26;
    background:
    linear-gradient(
        135deg,
        #43e97b,
        #38f9d7,
        #8b5cf6
    );
}

.logo-text{
    font-size:28px;
    font-weight:700;
    background:
    linear-gradient(
        135deg,
        #43e97b,
        #38f9d7,
        #8b5cf6
    );
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.sidebar-menu{
    list-style:none;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.sidebar-menu li{
    display:flex;
    align-items:center;
    gap:15px;
    padding:16px 18px;
    border-radius:18px;
    cursor:pointer;
    transition:.3s;
    color:#dbe7ec;
}

.sidebar-menu li:hover{
    background:
    rgba(255,255,255,0.08);
}

.sidebar-menu li.active{
    color:#021b26;
    font-weight:700;
    background:
    linear-gradient(
        135deg,
        #43e97b,
        #38f9d7,
        #8b5cf6
    );
}

/* CONTENT */

.content-area{
    flex:1;
    padding:40px;
}

/* TOPBAR */

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:35px;
}

.topbar h1{
    font-size:42px;
    margin-bottom:8px;
}

.topbar p{
    color:#b8c8cf;
}

/* PROFILE CHIP */

.profile-chip{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 16px;
    border-radius:18px;
    background:
    rgba(255,255,255,0.06);
    border:
    1px solid rgba(255,255,255,0.08);
}

.profile-avatar{
    width:42px;
    height:42px;
    border-radius:50%;
    background:
    linear-gradient(
        135deg,
        #43e97b,
        #38f9d7,
        #8b5cf6
    );
    display:flex;
    justify-content:center;
    align-items:center;
    color:#021b26;
    font-weight:bold;
}

/* CARD */

.card{
    background:
    linear-gradient(
        145deg,
        rgba(255,255,255,0.08),
        rgba(255,255,255,0.04)
    );
    border:
    1px solid rgba(255,255,255,0.08);
    border-radius:30px;
    padding:40px;
    backdrop-filter:blur(20px);
    box-shadow:
    0 15px 40px rgba(0,0,0,0.25);
}

/* PROFILE LAYOUT */

.profile-layout{
    display:grid;
    grid-template-columns:280px 1fr;
    gap:60px;
}

/* LEFT SIDE */

.profile-avatar-lg{
    width:180px;
    height:180px;
    border-radius:50%;
    background:
    linear-gradient(
        135deg,
        #43e97b,
        #38f9d7,
        #8b5cf6
    );
    display:flex;
    justify-content:center;
    align-items:center;
    color:#021b26;
    font-size:60px;
    font-weight:bold;
    margin:0 auto 25px;
}

.profile-meta{
    text-align:center;
    line-height:2;
    color:#dbe7ec;
}

.btn-soft{
    width:100%;
    display:block;
    margin-top:20px;
    padding:14px;
    border-radius:16px;
    background:
    rgba(255,255,255,0.06);
    border:
    1px solid rgba(255,255,255,0.08);
    color:#43e97b;
    text-align:center;
    cursor:pointer;
    font-weight:600;
}

.btn-danger{
    width:100%;
    margin-top:12px;
    height:54px;
    border:none;
    border-radius:16px;
    background:
    rgba(239,68,68,0.15);
    color:#ff7a7a;
    cursor:pointer;
    font-weight:600;
}

/* FORM */

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.form-label{
    color:#dbe7ec;
    font-weight:600;
}

.form-control{
    height:58px;
    border-radius:16px;
    border:
    1px solid rgba(255,255,255,0.10);
    background:
    rgba(255,255,255,0.08);
    color:white;
    padding:0 18px;
    outline:none;
}

.form-control:focus{
    border-color:#43e97b;
    box-shadow:
    0 0 0 4px rgba(67,233,123,0.10);
}

/* BUTTON */

.btn-primary{
    margin-top:30px;
    width:250px;
    height:58px;
    border:none;
    border-radius:18px;
    cursor:pointer;
    font-weight:700;
    font-size:16px;
    color:#021b26;
    background:
    linear-gradient(
        135deg,
        #43e97b,
        #38f9d7,
        #8b5cf6
    );
}

/* RESPONSIVE */

@media(max-width:1100px){

    .profile-layout{
        grid-template-columns:1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }
}

@media(max-width:850px){

    .sidebar{
        display:none;
    }

    .content-area{
        padding:20px;
    }

    .topbar{
        flex-direction:column;
        align-items:flex-start;
        gap:20px;
    }

    .topbar h1{
        font-size:34px;
    }
}

</style>

    .getElementById("scanModal")
    .style
    .display = "flex";

    document
    .getElementById("scanModal")
    .style
    .display = "none";

    localStorage.removeItem(

    );

<script>

const currentUser =
JSON.parse(
    localStorage.getItem(
        "currentUser"
    )
);

async function loadProfile(){

    try{

        const response =
        await fetch(

            `/api/hr-profile/${currentUser.id}`

        );

        const data =
        await response.json();

        document.getElementById(
            "fullName"
        ).value =
        data.full_name || "";

        document.getElementById(
            "email"
        ).value =
        data.email || "";

        document.getElementById(
            "phone"
        ).value =
        data.phone || "";

        document.getElementById(
            "company"
        ).value =
        data.company || "";

        document.getElementById(
            "designation"
        ).value =
        data.designation || "";

        document.getElementById(
            "profileName"
        ).innerText =
        data.full_name || "HR";

        document.getElementById(
            "profileEmail"
        ).innerText =
        data.email || "";

        document.getElementById(
            "profileAvatar"
        ).innerText =
        (
            data.full_name || "H"
        )
        .charAt(0)
        .toUpperCase();

    }

    catch(error){

        console.log(error);

    }
}

document
.getElementById(
    "profileForm"
)
.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();

        const formData = {

            full_name:
            document.getElementById(
                "fullName"
            ).value,

            email:
            document.getElementById(
                "email"
            ).value,

            phone:
            document.getElementById(
                "phone"
            ).value,

            company:
            document.getElementById(
                "company"
            ).value,

            designation:
            document.getElementById(
                "designation"
            ).value

        };

        await fetch(

            `/api/hr-profile/${currentUser.id}`,

            {

                method:"PUT",

                headers:{
                    "Content-Type":
                    "application/json"
                },

                body:
                JSON.stringify(
                    formData
                )
            }
        );

        alert(
            "Profile Updated Successfully"
        );

        loadProfile();
    }
);

loadProfile();

</script>
