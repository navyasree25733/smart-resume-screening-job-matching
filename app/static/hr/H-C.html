<script>

let candidates = [];

// const currentUser =
// JSON.parse(
//     localStorage.getItem(
//         "currentUser"
//     )
// );

// ==========================
// CURRENT USER
// ==========================

const currentUser = JSON.parse(
    localStorage.getItem("currentUser")
);

if (!currentUser) {
    window.location.href = "/login";
}

// Profile
document.getElementById("profileName").innerText =
    currentUser.full_name || currentUser.username;

document.getElementById("profileAvatar").innerText =
    (currentUser.full_name || currentUser.username)
    .charAt(0)
    .toUpperCase();


async function loadCandidates(){

    try{

        const response =
        await fetch(

            `/api/candidates/${currentUser.id}`

        );

        candidates =
        await response.json();

        renderTable(candidates);

        document.getElementById(
            "totalCandidates"
        ).innerText =
        candidates.length;

    }

    catch(error){

        console.error(error);

    }
}

function renderTable(data){

    document.getElementById(
        "candidateTableBody"
    ).innerHTML =

    data.map(c => `

        <tr>

            <td>
                ${c.name}
            </td>

            <td>
                ${c.role}
            </td>

            <td>

                <span class="score
                ${
                    c.ats_score >= 80
                    ? "high"
                    :
                    c.ats_score >= 60
                    ? "medium"
                    : "low"
                }">

                    ${c.ats_score.toFixed(1)}%

                </span>

            </td>

            <td>

                ${c.semantic_score.toFixed(1)}%

            </td>

            <td>

                <span class="status
                ${
                    c.ats_score >= 80
                    ? "shortlisted"
                    : "review"
                }">

                    ${
                        c.ats_score >= 80
                        ? "Shortlisted"
                        : "Review"
                    }

                </span>

            </td>

            <td>

                ${c.date}

            </td>

        </tr>

    `).join("");
}

document.getElementById(
    "searchInput"
).addEventListener(
"keyup",
function(){

    const keyword =
    this.value.toLowerCase();

    const filtered =
    candidates.filter(c =>

        c.name.toLowerCase()
        .includes(keyword)

        ||

        c.role.toLowerCase()
        .includes(keyword)

    );

    renderTable(filtered);
});

loadCandidates();
</script>
