<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Scan History</title>

    <link rel="stylesheet" href="style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

/* BODY */

body{

    background:
    linear-gradient(
        135deg,
        #021b26,
        #062432,
        #0b3142
    );

    color:white;

    overflow-x:hidden;

    position:relative;
}

/* BACKGROUND GLOW */

body::before{

    content:"";

    position:fixed;

    width:500px;
    height:500px;

    border-radius:50%;

    background:
    radial-gradient(
        rgba(67,233,123,0.12),
        transparent 70%
    );

    top:-180px;
    left:-150px;

    z-index:-1;
}

body::after{

    content:"";

    position:fixed;

    width:450px;
    height:450px;

    border-radius:50%;

    background:
    radial-gradient(
        rgba(139,92,246,0.14),
        transparent 70%
    );

    bottom:-180px;
    right:-150px;

    z-index:-1;
}

/* MAIN */

.main-layout{

    display:flex;

    min-height:100vh;
}

/* SIDEBAR */

.sidebar{

    width:280px;

    background:
    linear-gradient(
        180deg,
        rgba(7,25,38,0.96),
        rgba(5,18,28,0.98)
    );

    border-right:
    1px solid rgba(255,255,255,0.08);

    padding:25px 18px;

    position:sticky;

    top:0;

    height:100vh;

    overflow:hidden;

    backdrop-filter:blur(20px);

    box-shadow:
    10px 0 30px rgba(0,0,0,0.25);

    transition:0.3s;
}

/* COLLAPSED */

.sidebar.collapsed{

    width:90px;
}

.sidebar.collapsed .logo-text{

    display:none;
}

.sidebar.collapsed .sidebar-menu li span{

    display:none;
}

.sidebar.collapsed .sidebar-menu li{

    justify-content:center;
}

/* LOGO */

.logo-section{

    display:flex;

    align-items:center;

    gap:18px;

    margin-bottom:40px;
}

.menu-btn{

    width:46px;

    height:46px;

    border:none;

    border-radius:16px;

    background:
    linear-gradient(
        135deg,
        #43e97b,
        #38f9d7,
        #8b5cf6
    );

    color:#021b26;

    cursor:pointer;

    font-size:18px;

    box-shadow:
    0 10px 25px rgba(67,233,123,0.2);
}

.logo-text{

    font-size:28px;

    font-weight:bold;

    background:
    linear-gradient(
        135deg,
        #43e97b,
        #38f9d7,
        #8b5cf6
    );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;
}

/* MENU */

.sidebar-menu{

    list-style:none;
}

.sidebar-menu li{

    display:flex;

    align-items:center;

    gap:15px;

    padding:16px;

    border-radius:16px;

    cursor:pointer;

    margin-bottom:12px;

    transition:0.35s ease;

    color:#dbe7ec;
}

.sidebar-menu li:hover{

    background:
    rgba(255,255,255,0.08);

    transform:translateX(6px);
}

.sidebar-menu li.active{

    background:
    linear-gradient(
        135deg,
        #43e97b,
        #38f9d7,
        #8b5cf6
    );

    color:#021b26;

    font-weight:bold;

    box-shadow:
    0 10px 25px rgba(67,233,123,0.18);
}

/* CONTENT */

.content-area{

    flex:1;

    padding:35px;
}

/* TOPBAR */

.topbar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:35px;
}

.topbar h1{

    font-size:42px;

    margin-bottom:8px;
}

.topbar p{

    color:#b8c8cf;
}

/* PROFILE */

.profile-chip{

    display:flex;

    align-items:center;

    gap:12px;

    background:
    rgba(255,255,255,0.06);

    border:
    1px solid rgba(255,255,255,0.08);

    padding:10px 16px;

    border-radius:18px;

    backdrop-filter:blur(18px);

    cursor:pointer;
}

.profile-avatar{

    width:42px;

    height:42px;

    border-radius:50%;

    background:
    linear-gradient(
        135deg,
        #43e97b,
        #38f9d7,
        #8b5cf6
    );

    display:flex;

    justify-content:center;

    align-items:center;

    color:#021b26;

    font-weight:bold;
}

/* HISTORY ACTIONS */

.history-actions{

    display:flex;

    align-items:center;

    gap:15px;
}

/* SORT BUTTON */

.sort-btn{

    background:
    rgba(255,255,255,0.06);

    border:
    1px solid rgba(255,255,255,0.08);

    padding:12px 18px;

    border-radius:14px;

    color:white;

    cursor:pointer;

    backdrop-filter:blur(18px);

    transition:0.3s ease;
}

.sort-btn:hover{

    background:
    rgba(255,255,255,0.12);
}

/* HISTORY CONTAINER */

.history-table-container{

    background:
    linear-gradient(
        145deg,
        rgba(255,255,255,0.06),
        rgba(255,255,255,0.03)
    );

    border-radius:30px;

    overflow:hidden;

    border:
    1px solid rgba(255,255,255,0.08);

    backdrop-filter:blur(18px);

    box-shadow:
    0 15px 40px rgba(0,0,0,0.2);
}

/* TABLE */

table{

    width:100%;

    border-collapse:collapse;
}

thead{

    background:
    rgba(255,255,255,0.04);
}

th{

    padding:22px 18px;

    text-align:left;

    color:#43e97b;

    font-size:14px;

    border-bottom:
    1px solid rgba(255,255,255,0.08);
}

td{

    padding:22px 18px;

    border-bottom:
    1px solid rgba(255,255,255,0.05);

    color:#dbe7ec;

    vertical-align:middle;
}

tr{

    transition:0.3s ease;
}

tr:hover{

    background:
    rgba(255,255,255,0.03);
}

/* MINI SCORE */

.mini-score{

    width:56px;

    height:56px;

    border-radius:50%;

    display:flex;

    justify-content:center;

    align-items:center;

    font-weight:bold;

    color:white;

    background:
    radial-gradient(
        #021b26 55%,
        transparent 56%
    ),
    conic-gradient(
        #38f9d7 0%,
        #43e97b 100%
    );

    box-shadow:
    0 0 20px rgba(67,233,123,0.15);
}

/* GREEN SCORE */

.green-score{

    background:
    radial-gradient(
        #021b26 55%,
        transparent 56%
    ),
    conic-gradient(
        #43e97b 0%,
        #8b5cf6 100%
    );
}

/* STATUS */

.status{

    padding:10px 16px;

    border-radius:14px;

    font-size:13px;

    font-weight:bold;

    display:inline-block;
}

/* SAVED */

.saved{

    background:
    rgba(0,191,255,0.12);

    color:#38f9d7;
}

/* REVIEW */

.review{

    background:
    rgba(67,233,123,0.12);

    color:#43e97b;
}

/* DESCRIPTION */

.description-cell{

    max-width:420px;

    color:#b8c8cf;

    line-height:1.7;
}

/* MODAL */

.scan-modal{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,0.55);

    display:none;

    justify-content:center;

    align-items:center;

    z-index:999;
}

/* MODAL CONTENT */

.modal-content{

    width:90%;

    max-width:1100px;

    background:
    linear-gradient(
        145deg,
        #062432,
        #021b26
    );

    border:
    1px solid rgba(255,255,255,0.08);

    border-radius:30px;

    padding:30px;

    color:white;
}

/* MODAL HEADER */

.modal-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:25px;
}

.modal-header button{

    background:none;

    border:none;

    font-size:28px;

    color:white;

    cursor:pointer;
}

/* MODAL FOOTER */

.modal-footer{

    display:flex;

    justify-content:flex-end;

    align-items:center;

    gap:20px;

    margin-top:25px;
}

/* UPGRADE BUTTON */

.upgrade-btn{

    background:
    linear-gradient(
        135deg,
        #43e97b,
        #38f9d7,
        #8b5cf6
    );

    color:#021b26;

    border:none;

    padding:14px 20px;

    border-radius:14px;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s ease;
}

.upgrade-btn:hover{

    transform:
    translateY(-3px)
    scale(1.01);
}

/* RESPONSIVE */

@media(max-width:1100px){

    .history-table-container{

        overflow-x:auto;
    }
}

@media(max-width:850px){

    .sidebar{

        position:fixed;

        left:-280px;

        z-index:1000;
    }

    .sidebar.active{

        left:0;
    }

    .content-area{

        padding:20px;
    }

    .topbar{

        flex-direction:column;

        align-items:flex-start;

        gap:20px;
    }

    .topbar h1{

        font-size:34px;
    }

    .history-actions{

        width:100%;

        flex-wrap:wrap;
    }
}
.search-box{

    width:280px;

    height:52px;

    padding:0 20px;

    border:none;

    outline:none;

    border-radius:16px;

    background:
    rgba(255,255,255,0.06);

    border:
    1px solid rgba(255,255,255,0.08);

    backdrop-filter:blur(18px);

    color:white;

    font-size:15px;

    transition:0.35s ease;

    box-shadow:
    0 10px 25px rgba(0,0,0,0.12);
}

/* PLACEHOLDER */

.search-box::placeholder{

    color:#b8c8cf;
}

/* FOCUS */

.search-box:focus{

    border-color:
    rgba(67,233,123,0.35);

    box-shadow:
    0 0 0 4px rgba(67,233,123,0.08),
    0 15px 35px rgba(67,233,123,0.12);

    background:
    rgba(255,255,255,0.08);
}

/* RESPONSIVE */

@media(max-width:650px){

    .search-box{

        width:100%;
    }
}


</style>
<style>
    /* =========================
   SCAN MODAL
========================= */

.scan-modal{

    display:none;

    position:fixed;

    top:0;

    left:0;

    width:100%;

    height:100%;

    background:
    rgba(0,0,0,0.65);

    backdrop-filter:blur(8px);

    z-index:9999;

    justify-content:center;

    align-items:center;
}

.scan-modal.active{

    display:flex;
}

.modal-content{

    width:90%;

    max-width:1100px;

    background:
    linear-gradient(
        145deg,
        rgba(7,25,38,0.96),
        rgba(5,18,28,0.98)
    );

    border:
    1px solid rgba(255,255,255,0.08);

    border-radius:30px;

    padding:35px;

    box-shadow:
    0 25px 80px rgba(0,0,0,0.4);
}

/* HEADER */

.modal-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:30px;
}

.modal-header h2{

    font-size:32px;

    font-weight:700;

    color:white;
}

.modal-header button{

    width:45px;

    height:45px;

    border:none;

    border-radius:14px;

    cursor:pointer;

    font-size:18px;

    color:white;

    background:
    rgba(255,255,255,0.08);

    transition:0.3s;
}

.modal-header button:hover{

    background:
    rgba(239,68,68,0.2);

    color:#ff7a7a;
}

/* GRID */

.scan-grid{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:25px;

    margin-bottom:30px;
}

/* BOX */

.scan-box{

    background:
    rgba(255,255,255,0.04);

    border:
    1px solid rgba(255,255,255,0.08);

    border-radius:24px;

    padding:25px;
}

.scan-header{

    margin-bottom:20px;
}

.scan-header h3{

    color:#43e97b;

    font-size:20px;

    font-weight:600;
}

/* UPLOAD */

.upload-area{

    min-height:250px;

    border:
    2px dashed rgba(67,233,123,0.4);

    border-radius:20px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    gap:15px;

    background:
    rgba(255,255,255,0.02);
}

.upload-area i{

    font-size:60px;

    color:#43e97b;
}

.upload-area p{

    color:#dbe7ec;

    font-size:16px;
}

.upload-area input[type="file"]{

    width:100%;

    max-width:280px;

    color:white;

    padding:10px;
}

/* TEXTAREA */

.scan-box textarea{

    width:100%;

    height:250px;

    padding:18px;

    border-radius:18px;

    resize:none;

    border:
    1px solid rgba(255,255,255,0.08);

    background:
    rgba(255,255,255,0.05);

    color:white;

    font-size:15px;

    outline:none;
}

.scan-box textarea:focus{

    border-color:#43e97b;

    box-shadow:
    0 0 0 4px rgba(67,233,123,0.1);
}

.scan-box textarea::placeholder{

    color:
    rgba(255,255,255,0.45);
}

/* FOOTER */

.modal-footer{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:20px;
}

/* AVAILABLE SCANS */

.upgrade-btn{

    padding:14px 24px;

    border:none;

    border-radius:16px;

    font-size:15px;

    font-weight:600;

    color:white;

    background:
    rgba(255,255,255,0.08);

    border:
    1px solid rgba(255,255,255,0.08);
}

/* ANALYZE */

.analyze-btn{

    min-width:220px;

    height:56px;

    border:none;

    border-radius:18px;

    cursor:pointer;

    font-size:16px;

    font-weight:700;

    color:#021b26;

    background:
    linear-gradient(
        135deg,
        #43e97b,
        #38f9d7,
        #8b5cf6
    );

    transition:0.3s;
}

.analyze-btn:hover{

    transform:translateY(-2px);

    box-shadow:
    0 15px 35px
    rgba(67,233,123,0.25);
}

/* RESPONSIVE */

@media(max-width:900px){

    .scan-grid{

        grid-template-columns:1fr;
    }

    .modal-content{

        width:95%;

        padding:25px;
    }

    .modal-footer{

        flex-direction:column;
    }

    .analyze-btn{

        width:100%;
    }

    .upgrade-btn{

        width:100%;
    }
}
</style>

<body>

<div class="main-layout">
    <div class="sidebar" id="sidebar">
        <div class="logo-section">
            <button
                class="menu-btn"
                onclick="toggleSidebar()"
            >
                <i class="fa-solid fa-bars"></i>
            </button>
            <h2 class="logo-text">
                TalentSync
            </h2>
        </div>
        <ul class="sidebar-menu">
            <!-- <li class="new-scan-btn" onclick="handleNewScan()">
                <i class="fa-solid fa-plus"></i>
                <span>New Scan</span>
            </li> -->

            <li onclick="window.location.href='/C-D'">

            </li>
            <li class="active">

                <span>History</span>
            </li>
            <li onclick="window.location.href='/C-P'">
                <i class="fa-solid fa-user"></i>
                <span>Profile</span>
            </li>
            <li onclick="logoutUser()">
                <i class="fa-solid fa-right-from-bracket"></i>

                </span>
            </li>
        </ul>
    </div>

    <div class="content-area">

            <div>

                    View all previous ATS resume scans
                </p>
            </div>
            <div class="history-actions">
                <form
                    method="GET"
                    action="/history"
                >
                <input
                        type="text"
                        name="search"
                        placeholder="Search company or role"
                        class="search-box"
                        
                    >
                </form> 
<!-- 
               <a href="/history?sort=latest"> 
                <button class="sort-btn">
                    <i class="fa-solid fa-arrow-down-wide-short"></i>
                    Sort
                </button>
                </a> -->

            </div>

        <!-- HISTORY TABLE -->

        <div class="history-table-container">

            <table>

                <thead>

                    <tr>

                        <th>Score</th>

                        <th>Company / Role</th>

                        <th>Job Description</th>

                        <th>Status</th>

</div>

<!-- NEW SCAN MODAL -->


<div class="scan-modal" id="scanModal">

    <div class="modal-content">

        <div class="modal-header">

            <h2>

            </h2>

            <button onclick="closeModal()">

                ✕

            </button>

    </div>

</div>



<script>

// ==========================
// CURRENT USER
// ==========================

const currentUser = JSON.parse(
    localStorage.getItem(
        "currentUser"
    )
);

if (!currentUser) {

    window.location.href =
        "/login";
}

// Profile Name
document.getElementById(
    "profileName"
).innerText =
    currentUser.full_name ||
    currentUser.username ||
    "User";

// Profile Avatar
document.getElementById(
    "profileAvatar"
).innerText =
(
    currentUser.full_name ||
    currentUser.username ||
    "U"
)
.charAt(0)
.toUpperCase();


// ==========================
// LOAD HISTORY
// ==========================

async function loadHistory() {

    try {

        const response =
        await fetch(
            `/api/history/${currentUser.id}`
        );

        if (!response.ok) {

            throw new Error(
                `Server Error ${response.status}`
            );
        }

        const data =
        await response.json();

        console.log(
            "History Data:",
            data
        );

        const tbody =
        document.getElementById(
            "historyTableBody"
        );

        if (!data.length) {

            tbody.innerHTML = `
                <tr>
                    <td colspan="6"
                        style="
                            text-align:center;
                            padding:30px;
                        ">
                        No resume scans found
                    </td>
                </tr>
            `;

            return;
        }

        tbody.innerHTML =

        data.map(item => `

            <tr>

                <td>

                    <div class="mini-score">
                        ${Math.round(
                            item.ats_score || 0
                        )}%
                    </div>

                </td>

                <td>
                    ${item.role || "-"}
                </td>

                <td>
                    ${item.file_name || "-"}
                </td>

                <td>

                    <span class="status review">

                        ${
                            (item.ats_score || 0) >= 80
                            ? "Shortlisted"
                            : "Review"
                        }

                    </span>

                </td>

                <td>
                    ${item.scan_date || "-"}
                </td>

                <td>

                    <div class="action-icons">
                        <i 
                        class="fa fa-eye"
                        onclick="viewReport(${item.id})"
                        style="cursor:pointer; color: #41ffd7"
                        ></i>

                    </div>

                </td>

            </tr>

        `).join("");

    }

    catch(error){

        console.error(
            "History Error:",
            error
        );

        document.getElementById(
            "historyTableBody"
        ).innerHTML = `
            <tr>
                <td colspan="6"
                    style="
                        text-align:center;
                        color:red;
                        padding:20px;
                    ">
                    Failed to load history
                </td>
            </tr>
        `;
    }
}

// Load History
loadHistory();

async function viewReport(historyId){

    try{

        const response =
        await fetch(
            `/api/report/${historyId}`
        );

        if(!response.ok){

            throw new Error(
                "Failed to load report"
            );
        }

        const report =
        await response.json();

        console.log(
            "Loaded Report:",
            report
        );

        localStorage.setItem(
            "resumeResult",
            JSON.stringify({

                ...report.ats_result,

                skills:
                report.skills,

                recommended_jobs:
                report.recommended_jobs

            })
        );

        window.location.href =
        `/static/consumer/C-R.html?id=${historyId}`;

    }

    catch(error){

        console.error(error);

        alert(
            "Failed to load report"
        );
    }
}
</script>
